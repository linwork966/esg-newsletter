name: ESG Weekly Newsletter (Free)

on:
  schedule:
    # 每週一 10:00 AM 台灣時間 (UTC+8) = UTC 02:00
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # ← cache: 'pip' 已移除，這是失敗原因

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Sync with remote
        run: |
          git config --global user.name "ESG Bot"
          git config --global user.email "esg-bot@github-actions"
          git pull --rebase origin main

      - name: Generate ESG Report
        run: python scripts/generate_esg_free.py

      - name: Commit and push report
        run: |
          git add docs/
          git diff --staged --quiet || git commit -m "📊 ESG Report $(date +'%Y-%m-%d')"
          git push

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          printf "Last run: $(date -u '+%Y-%m-%d %H:%M UTC')\nTW: $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M %Z')\n" > .github/last-run.txt
          git add .github/last-run.txt
          git diff --staged --quiet || git commit -m "🔄 keepalive $(date +'%Y-%m-%d')"
          git push || true
