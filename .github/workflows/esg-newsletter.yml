name: ESG Weekly Newsletter (Free)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Generate ESG Report
        run: python scripts/generate_esg_free.py

      - name: Commit and push
        run: |
          git config --global user.name "ESG Bot"
          git config --global user.email "esg-bot@actions"
          git pull --rebase origin main
          git add docs/
          git diff --staged --quiet || git commit -m "📊 ESG Report $(date +'%Y-%m-%d')"
          git push
